name: Release

# Publishing is not currently configured for this fork. See the decisions table in
# docs/apollo-5-migration-plan.md.
#
# This workflow is kept, but is manual-only rather than firing on a v* tag, so that
# an accidental tag cannot start a publish that would fail anyway:
#   - no Sonatype namespace or GPG key is set up for this fork's groupId
#   - the `publication` profile still uses dokka 0.9.17, which does not work under Kotlin 2
#
# Before re-enabling the tag trigger, fix dokka and settle the publishing decision.
on:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Java for publishing to Maven Central
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GPG_TTY=$(tty)
          git config user.name "${{ github.event.head_commit.committer.name }}"
          git config user.email "${{ github.event.head_commit.committer.email }}"
          ./mvnw --no-transfer-progress -B -Dmaven.site.skip=true -Drelease=true dependency:go-offline deploy
